<!DOCTYPE html>
<html lang="he" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>זילברמינץ | מערכת ניהול נכסים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1f3d;--navy-light:#1a3060;--gold:#c9a84c;--gold-light:#e8c97a;--gold-pale:#f5e9c8;
  --cream:#f6f7f9;--g100:#f1f3f5;--g200:#e3e6ea;--g300:#cbd0d8;--g400:#9aa0ac;--g600:#5f6878;--g800:#2d3340;
  --green:#1a7f5a;--orange:#c97a1a;--red:#c23b2e;--blue:#1a5f9f;
  --sh-sm:0 2px 8px rgba(15,31,61,.07);--sh-md:0 6px 24px rgba(15,31,61,.11);--sh-lg:0 16px 48px rgba(15,31,61,.15);
  --r:14px;--r-sm:8px;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--cream);color:var(--g800);min-height:100vh;direction:rtl}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{text-align:center;max-width:480px;width:100%;animation:fadeIn .4s ease}
.login-logo{width:70px;height:70px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--navy);margin:0 auto 20px}
.login-title{color:#fff;font-size:26px;font-weight:800;margin-bottom:6px}
.login-sub{color:var(--gold);font-size:14px;margin-bottom:48px}
.login-footer{margin-top:32px;color:rgba(255,255,255,.2);font-size:11px}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;z-index:200;overflow-y:auto}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--navy);flex-shrink:0}
.logo-text{color:#fff;font-size:15px;font-weight:800;line-height:1.1}
.logo-sub{color:var(--gold);font-size:10px;font-weight:400}
.nav-section{padding:12px 10px 4px;font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:1px 8px;border-radius:9px;color:rgba(255,255,255,.55);font-size:13px;font-weight:500;cursor:pointer;transition:all .18s;border:none;background:none;font-family:'Heebo',sans-serif;width:calc(100% - 16px);text-align:right}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(201,168,76,.18);color:var(--gold-light);font-weight:600}
.nav-item .ni{font-size:16px;flex-shrink:0}
.sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.logout-btn{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);padding:8px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:12px;cursor:pointer;transition:all .2s}
.logout-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.content{margin-right:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh-sm)}
.topbar-title{font-size:17px;font-weight:700;color:var(--navy)}
.topbar-right{display:flex;align-items:center;gap:12px}
.greeting{font-size:13px;color:var(--g400)}.greeting strong{color:var(--navy)}
.topbar-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-light));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
.role-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}

/* BUTTONS */
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy);border:none;padding:8px 18px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(201,168,76,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(201,168,76,.35)}
.btn-ghost{background:none;border:1.5px solid var(--g200);color:var(--g600);padding:7px 16px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-danger{background:none;border:1.5px solid #fde8e6;color:var(--red);padding:7px 16px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-danger:hover{background:#fde8e6}

.page{padding:28px;display:none}.page.active{display:block}

/* CARDS */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--g200);box-shadow:var(--sh-sm);overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between}
.card-head h3{font-size:14px;font-weight:700;color:var(--navy)}
.card-body{padding:16px 18px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh-sm);border:1px solid var(--g200);position:relative}
.kpi-icon{position:absolute;top:12px;left:12px;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.kpi-label{font-size:11px;color:var(--g400);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;padding-top:2px}
.kpi-val{font-size:24px;font-weight:800;color:var(--navy);line-height:1}

/* PREVENTIVE MAINTENANCE LIST */
.preventive-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh-sm);margin-bottom:12px; transition:all .2s; border-right: 4px solid var(--g300)}
.preventive-card:hover {transform:translateY(-1px); box-shadow:var(--sh-md);}
.preventive-card.upcoming {border-right-color: var(--orange); background: #fffcf5;}
.preventive-card.overdue {border-right-color: var(--red); background: #fdf8f8;}
.preventive-info{display:flex;align-items:center;gap:14px}
.preventive-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--gold-pale);color:#9a6f20}
.recurrence-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;background:#e3f0ff;color:var(--blue)}
.preventive-files-preview {margin-top: 8px; display:flex; gap:6px; flex-wrap:wrap;}
.file-link-tag {font-size:11px; background:var(--g100); padding:3px 10px; border-radius:10px; color:var(--blue); font-weight:500;}

/* FORMS & TABLES */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:18px}
.fg label {font-size:13px;font-weight:600;color:var(--navy)}
.fg input,.fg select,.fg textarea{font-family:'Heebo',sans-serif;font-size:14px;padding:10px 13px;border:1.5px solid var(--g200);border-radius:var(--r-sm);color:var(--g800);background:#fff;outline:none;width:100%}
.fg input:focus,.fg select:focus{border-color:var(--gold)}
.full{grid-column:1/-1}
.file-upload-zone{border:2px dashed var(--g200);border-radius:var(--r-sm);padding:14px;text-align:center;cursor:pointer;background:var(--g100);display:block;margin-bottom:8px}
.file-upload-zone:hover{border-color:var(--gold);background:var(--gold-pale)}
.uploaded-files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.file-chip{background:#fff;border:1px solid var(--g200);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--navy);display:flex;align-items:center;gap:5px}
.file-chip button{background:none;border:none;cursor:pointer;color:var(--g400);font-size:11px}
.maint-record-card{background:#fff;border-radius:var(--r);border:1px solid var(--g200);padding:14px 16px;box-shadow:var(--sh-sm);margin-bottom:12px;cursor:pointer}
.empty{text-align:center;padding:32px 20px;color:var(--g400);font-size:13px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:500;transition:transform .4s;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
@media(max-width:900px){.dash-row{grid-template-columns:1fr}}

/* NEW MULTI-LEVEL LOGIN SYSTEM INTERFACE */
.login-split-container {display:grid; gap:12px; max-width:440px; margin:0 auto;}
.sub-login-grid {display:none; flex-direction:column; gap:10px; animation:slideUp .25s ease;}
.back-login-btn {background:none; border:none; color:var(--gold); font-size:13px; cursor:pointer; text-align:right; margin-bottom:8px; display:inline-flex; align-items:center; gap:4px;}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBJ1dbRc0_4UHUdExIxEocTJpRaDcZO2Ao",
    authDomain: "zilbermintz-1938c.firebaseapp.com",
    projectId: "zilbermintz-1938c",
    storageBucket: "zilbermintz-1938c.firebasestorage.app",
    messagingSenderId: "350076498890",
    appId: "1:350076498890:web:2fcfd143d10f6572c55533",
    measurementId: "G-7VWJQECYBC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.cloudSave = async (col, id, data) => { await setDoc(doc(db, col, id), data); };
  window.cloudDelete = async (col, id) => { await deleteDoc(doc(db, col, id)); };
  
  onSnapshot(collection(db, "maintenance"), (snapshot) => {
      window.maintRecords = snapshot.docs.map(doc => doc.data()).sort((a,b) => b.date.localeCompare(a.date));
      window.renderPageFull(window.currentPage);
  });
  onSnapshot(collection(db, "preventive"), (snapshot) => {
      window.preventiveTasks = snapshot.docs.map(doc => doc.data()).sort((a,b) => a.dueDate.localeCompare(b.dueDate));
      window.renderPageFull(window.currentPage);
  });
</script>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Z</div>
    <div class="login-title">זילברמינץ</div>
    <div class="login-sub">מערכת ניהול נכסים</div>
    
    <div id="main-login-hub" class="login-split-container">
        <button class="lbtn lmgr" style="border:1.5px solid rgba(201,168,76,.3); background:rgba(201,168,76,.1);" onclick="openStaffSubLogin()">
            <div class="lav" style="background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:var(--navy)">⚙️</div>
            <div style="flex:1; text-align:right;">
                <div style="font-size:15px; font-weight:700; color:#fff;">כניסת מנהלים וצוות תחזוקה</div>
                <div style="font-size:11px; color:rgba(255,255,255,.4); margin-top:2px;">גישה לדשבורד, פיקוח עלויות וניהול לוחות משימות שטח</div>
            </div>
            <span style="color:rgba(255,255,255,.2); font-size:20px">›</span>
        </button>
        
        <button class="lbtn" style="border:1.5px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05);" onclick="loginAsUser('u3')">
            <div class="lav" style="background:rgba(26,95,159,.25); color:#6db3f2">🏠</div>
            <div style="flex:1; text-align:right;">
                <div style="font-size:15px; font-weight:700; color:#fff;">פורטל דיירים</div>
                <div style="font-size:11px; color:rgba(255,255,255,.4); margin-top:2px;">פתיחת קריאות שירות שוטפות ודיווח על תקלות בבניין</div>
            </div>
            <span style="color:rgba(255,255,255,.2); font-size:20px">›</span>
        </button>
    </div>

    <div id="staff-login-hub" class="sub-login-grid">
        <button class="back-login-btn" onclick="backToMainLoginHub()">🔀 חזור למסך הראשי</button>
        <div id="staff-users-container" class="login-split-container"></div>
    </div>

    <div class="login-footer">© זילברמינץ ניהול נכסים</div>
  </div>
</div>

<div class="layout">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">Z</div><div><div class="logo-text">זילברמינץ</div><div class="logo-sub">ניהול נכסים</div></div></div>
  <div id="nav-manager" style="display:none">
    <div class="nav-section">ניהול</div>
    <button class="nav-item" onclick="showPage('dashboard',this)"><span class="ni">📊</span>דשבורד פיננסי</button>
    <button class="nav-item" onclick="showPage('maintenance',this)"><span class="ni">🏗️</span>תחזוקה ומשימות</button>
  </div>
  <div id="nav-engineer" style="display:none">
    <div class="nav-section">אב בית</div>
    <button class="nav-item" onclick="showPage('maintenance',this)"><span class="ni">🏗️</span>לוח משימות שטח</button>
  </div>
  <div id="nav-tenant" style="display:none">
    <div class="nav-section">דייר</div>
    <button class="nav-item" onclick="showPage('tenant',this)"><span class="ni">📝</span>פתיחת קריאה</button>
  </div>
